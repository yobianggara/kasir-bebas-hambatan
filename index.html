document.getElementById('role').addEventListener('change',function(){document.getElementById('pinBox').style.display=this.value==='admin'?'block':'none'; checkBluetooth();});
function showTab(id){
  if(role!=="admin" && ["menuAdmin","laporan"].includes(id)) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==="laporan") loadLaporan();
  if(id==="menuAdmin") renderMenuAdmin();
  if(id==="kasir") renderKasir();
}
function doLogin(){
  let r=document.getElementById('role').value;
  let pin=document.getElementById('pin').value.trim();
  if(r==="admin" && pin!=="112234"){document.getElementById('loginStatus').innerText="Kode admin salah! 112234"; return;}
  role=r; cabang=document.getElementById('namaCabang').value.trim()||"Cabang"; kasir=document.getElementById('namaKasir').value.trim()||"Kasir";
  localStorage.setItem('kbh_role',r); localStorage.setItem('kbh_cabang',cabang); localStorage.setItem('kbh_kasir',kasir);
  document.getElementById('login').classList.remove('active'); init();
}
async function init(){
  document.getElementById('header').className=role==="admin"?'header admin':'header';
  document.getElementById('infoC').innerText=cabang;
  document.getElementById('navMenu').style.display=role==="admin"?'inline-block':'none';
  document.getElementById('navLap').style.display=role==="admin"?'inline-block':'none';
  document.getElementById('cabangLabel').innerText=cabang;
  await loadMenuFixed();
  renderCat(); renderKasir(); setupRTFixed(); showTab('kasir'); checkBluetooth();
}
async function loadMenuFixed(){
  try{
    let local=JSON.parse(localStorage.getItem('kbh_menu_final_v2')||'[]');
    if(local && local.length>=10){ menu=local; }
    else { menu=defaultMenu.map(m=>({id:m.nama, ...m})); localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu)); }
  }catch(e){ menu=defaultMenu.map(m=>({id:m.nama, ...m})); }
  if(window.db){
    try{
      let snap=await window.fs.getDocs(window.fs.collection(window.db,"menu"));
      if(snap.docs.length>=10){ menu=snap.docs.map(d=>({id:d.id,...d.data()})); localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu)); }
      else if(snap.docs.length===0){ for(let m of defaultMenu){ try{ await window.fs.setDoc(window.fs.doc(window.db,"menu",m.nama), m); }catch(e){} } }
    }catch(e){}
  }
}
function setupRTFixed(){
  if(!window.db) return;
  window.fs.onSnapshot(window.fs.collection(window.db,"menu"), s=>{
    let remote=s.docs.map(d=>({id:d.id,...d.data()}));
    if(remote.length===0) return;
    if(remote.length < 10) return;
    menu=remote;
    localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu));
    renderKasir(); renderMenuAdmin(); renderCat();
  });
}
function renderCat(){
 let cats=["Semua", ...new Set(menu.map(m=>m.kategori))];
 document.getElementById('catFilter').innerHTML=cats.map(c=>`<span class="cat-chip ${activeCat===c?'active':''}" onclick="setCat('${c}')">${c}</span>`).join("");
 document.getElementById('totalMenu').innerText=menu.length;
}
function setCat(c){ activeCat=c; renderCat(); renderKasir(); }
function renderKasir(){
 let cari=(document.getElementById('cariMenu').value||"").toLowerCase();
 let filtered=menu.filter(m=>{
  let matchCat=activeCat==="Semua"||m.kategori===activeCat;
  let matchSearch=m.nama.toLowerCase().includes(cari);
  return matchCat && matchSearch;
 });
 let grid=document.getElementById('menuGrid');
 if(filtered.length===0){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px;background:white;border-radius:10px">Tidak ada menu - Klik Kembalikan Default</div>'; return; }
 grid.innerHTML=filtered.map(m=>'<div class="menu-card" onclick="addCart(\''+m.id.replace(/\'/g,"\\'")+'\')"><div><b>'+m.nama+'</b><br><small>'+m.kategori+'</small></div><div class="price">Rp'+m.harga.toLocaleString('id-ID')+'</div></div>').join("");
}
function addCart(id){ let m=menu.find(x=>x.id===id); if(!m) return; let ex=keranjang.find(k=>k.id===id); if(ex) ex.qty++; else keranjang.push({...m,qty:1}); renderCart(); }
function renderCart(){
 if(keranjang.length===0){ document.getElementById('listKeranjang').innerHTML='<div style="text-align:center;color:#999;padding:20px">Kosong</div>'; }
 else { document.getElementById('listKeranjang').innerHTML=keranjang.map((k,i)=>'<div style="display:flex;justify-content:space-between;padding:7px;border-bottom:1px dashed #eee"><span><b>'+k.nama+'</b> x'+k.qty+'</span><span><button onclick="chgQty('+i+',-1)">-</button> '+k.qty+' <button onclick="chgQty('+i+',1)">+</button> <button onclick="delCart('+i+')" style="color:red">x</button> | Rp'+(k.harga*k.qty).toLocaleString('id-ID')+'</span></div>').join(""); }
 let sub=keranjang.reduce((t,k)=>t+k.harga*k.qty,0); total=sub; document.getElementById('sub').innerText=sub.toLocaleString('id-ID'); document.getElementById('total').innerText=sub.toLocaleString('id-ID'); hitungKembali();
}
function chgQty(i,d){ keranjang[i].qty+=d; if(keranjang[i].qty<=0) keranjang.splice(i,1); renderCart(); }
function delCart(i){ keranjang.splice(i,1); renderCart(); }
function hitungKembali(){ let b=parseInt(document.getElementById('bayar').value)||0; document.getElementById('kembali').innerText=(b-total).toLocaleString('id-ID'); }
let lastStruk=""; window.lastStrukHtml="";
function makeStruk(data){
 let tgl = new Date().toLocaleString('id-ID', {weekday:'long', day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
 let s = "       DAPUR MORO KUTO\n    Terminal Wisata Makuthoromo\n------------------------------\n"+tgl+"\nCabang: "+data.cabang+"\nKasir: "+data.namaKasir+"\nMeja: "+data.pelanggan+"\n------------------------------\n";
 data.items.forEach(k=>{
  let line=k.nama;
  if(line.length>30) line=line.substring(0,30);
  s+=line+"\n  "+k.qty+" x "+k.harga.toLocaleString('id-ID')+" = "+(k.harga*k.qty).toLocaleString('id-ID')+"\n";
 });
 s+="------------------------------\nTotal: Rp"+data.total.toLocaleString('id-ID')+"\nBayar: Rp"+data.bayar.toLocaleString('id-ID')+"\nKembali: Rp"+data.kembalian.toLocaleString('id-ID')+"\n------------------------------\n Terima Kasih\n Ditunggu kedatangannya kembali\n 0821 3595 0906\n------------------------------\n";
 lastStruk=s;
 window.lastStrukHtml = "<pre style='font-family:monospace;font-size:12px'>"+s+"</pre>";
 return s;
}
async function bayar(){
 if(keranjang.length===0) return alert("Kosong!"); let bayarVal=parseInt(document.getElementById('bayar').value)||0; if(bayarVal<total) return alert("Uang kurang!");
 let data={tanggal:new Date().toISOString(),cabang,namaKasir:kasir,pelanggan:document.getElementById('pelanggan').value||"Umum",total,bayar:bayarVal,kembalian:bayarVal-total,items:keranjang.map(k=>({nama:k.nama,qty:k.qty,harga:k.harga})),createdAt:Date.now()};
 makeStruk(data);
 try{ if(window.db) await window.fs.addDoc(window.fs.collection(window.db,"penjualan"), data); }catch(e){}
 keranjang=[]; document.getElementById('bayar').value=""; document.getElementById('pelanggan').value=""; renderCart();
 setTimeout(()=>{ printSimple(); }, 500);
}

 else txt+="✅ Browser support Bluetooth.<br>";

let savedDevice=null;
async function printSimple(){
 if(!lastStruk){ alert("Bayar dulu atau klik TEST PRINT!"); return; }
 let status=document.getElementById('printStatus');
 status.innerText="Coba konek ke RPP02N... Pastikan sudah Pair PIN 0000 di Bluetooth HP!";
 try{
  if(!navigator.bluetooth) throw new Error("Browser tidak support Web Bluetooth. Pakai Chrome Android versi terbaru dan buka via HTTPS.");
  let device;
  try{
   device=await navigator.bluetooth.requestDevice({filters:[{name:"RPP02N"},{namePrefix:"RPP"}], optionalServices:["00001101-0000-1000-8000-00805f9b34fb", 0xFF00, 0xFFE0, "000018f0-0000-1000-8000-00805f9b34fb"]});
  }catch(e){
   status.innerText="Cari semua printer... Pilih RPP02N!";
   device=await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:["00001101-0000-1000-8000-00805f9b34fb", 0xFF00, 0xFFE0, "000018f0-0000-1000-8000-00805f9b34fb"]});
  }
  savedDevice=device;
  status.innerText="Konek ke "+device.name+"...";
  const server=await device.gatt.connect();
  let service=null;
  for(let uuid of ["00001101-0000-1000-8000-00805f9b34fb", 0xFF00, 0xFFE0, "000018f0-0000-1000-8000-00805f9b34fb"]){ try{service=await server.getPrimaryService(uuid); if(service) break;}catch(e){} }
  if(!service){ let svcs=await server.getPrimaryServices(); service=svcs[0]; }
  let char=null;
  for(let uuid of ["00001101-0000-1000-8000-00805f9b34fb", 0xFFE1, 0xFF02, "0000ff01-0000-1000-8000-00805f9b34fb"]){ try{char=await service.getCharacteristic(uuid); if(char) break;}catch(e){} }
  if(!char){ let cs=await service.getCharacteristics(); char=cs[0]; }
  let enc=new TextEncoder();
  try{ await char.writeValue(Uint8Array.from([27,64])); }catch(e){}
  status.innerText="Print ke "+device.name+"...";
  for(let i=0;i<lastStruk.length;i+=100){ await char.writeValue(enc.encode(lastStruk.substring(i,i+100))); await new Promise(r=>setTimeout(r,60)); }
  await char.writeValue(enc.encode("\n\n\n"));
  status.innerText="✅ SUKSES print ke "+device.name+"!";
  status.style.background="#C8E6C9";
 }catch(e){
  let err=e.message||e;
  status.innerText="❌ Bluetooth gagal: "+err;
  status.style.background="#FFCDD2";
  document.getElementById('bluetoothInfo').innerHTML+="<br><b>Error:</b> "+err+"<br><b>Solusi:</b><br>1. HP > Settings > Bluetooth > Pair RPP02N PIN 0000<br>2. Pakai Chrome Android terbaru<br>3. Buka via HTTPS (github.io sudah HTTPS)<br>4. Kalau masih gagal, klik Print Kertas -> Pilih printer RPP02N di dialog print Chrome<br>5. Atau install RawBT app";
  // Fallback browser print
  try{
   let w=window.open("","","width=300,height=600");
   w.document.write("<html><head><style>body{font-family:monospace;font-size:12px}</style></head><body>"+window.lastStrukHtml+"<script>setTimeout(()=>{window.print();},400)<\/script></body></html>");
   w.document.close();
  }catch(e2){}
 }
}

function printKertas(){
 if(!lastStruk){ alert("Bayar dulu atau TEST PRINT!"); return; }
 let w=window.open("","","width=300,height=600");
 w.document.write("<html><head><title>Struk</title><style>@media print{ @page{margin:0; size:58mm auto} } body{font-family:monospace;font-size:12px;padding:8px}</style></head><body>"+window.lastStrukHtml+"<script>setTimeout(()=>{window.print();},400)<\/script></body></html>");
 w.document.close();
 document.getElementById('printStatus').innerText="Print Kertas: Pilih printer RPP02N di dialog!";
}

async function tambahMenu(){ let nama=document.getElementById('mNama').value.trim(); let harga=parseFloat(document.getElementById('mHarga').value)||0; let kat=document.getElementById('mKategori').value; if(!nama||harga<=0) return alert("Isi nama & harga"); let obj={nama,harga,kategori:kat,createdAt:Date.now()}; menu=menu.filter(m=>m.id!==nama); menu.push({id:nama,...obj}); localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu)); renderCat(); renderKasir(); renderMenuAdmin(); try{ if(window.db) await window.fs.setDoc(window.fs.doc(window.db,"menu",nama), obj); }catch(e){} document.getElementById('mNama').value=""; document.getElementById('mHarga').value=""; }
function renderMenuAdmin(){ document.getElementById('tabelMenu').innerHTML="<tr><th>Nama</th><th>Harga</th><th>Kategori</th><th></th></tr>"+menu.map(m=>"<tr><td>"+m.nama+"</td><td>"+m.harga.toLocaleString('id-ID')+"</td><td>"+m.kategori+"</td><td><button onclick=\"hapusMenu('"+m.id.replace(/'/g,"\\'")+"')\" style=\"background:#c0392b;color:white;border:none;border-radius:4px;padding:3px 6px;font-size:9px\">Hapus</button></td></tr>").join(""); document.getElementById('totalMenu').innerText=menu.length; }
async function hapusMenu(id){ if(!confirm("Hapus "+id+"?")) return; menu=menu.filter(m=>m.id!==id); localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu)); renderCat(); renderKasir(); renderMenuAdmin(); try{ const mod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"); await mod.deleteDoc(window.fs.doc(window.db,"menu",id)); }catch(e){} }
async function restoreDefault(){ if(!confirm("Kembalikan 105 menu default?")) return; menu=defaultMenu.map(m=>({id:m.nama, ...m})); localStorage.setItem('kbh_menu_final_v2', JSON.stringify(menu)); renderCat(); renderKasir(); renderMenuAdmin(); if(window.db){ for(let m of defaultMenu){ try{ await window.fs.setDoc(window.fs.doc(window.db,"menu",m.nama), m); }catch(e){} } } alert("Menu dipulihkan: "+menu.length); }
async function hapusTransaksiSample(){ if(!confirm("Hapus SEMUA transaksi? Laporan jadi bersih!")) return; if(!window.db) return alert("Firebase tidak connect"); try{ let snap=await window.fs.getDocs(window.fs.collection(window.db,"penjualan")); let count=0; for(let d of snap.docs){ await window.fs.deleteDoc(window.fs.doc(window.db,"penjualan",d.id)); count++; } alert("Berhasil hapus "+count+" transaksi. Laporan bersih!"); loadLaporan(); }catch(e){ alert("Gagal: "+e.message); } }
function bersihkanLocal(){ if(!confirm("Bersihkan cache HP?")) return; localStorage.removeItem('kbh_menu_final'); localStorage.removeItem('kbh_menu_final_v2'); location.reload(); }
async function loadLaporan(){ try{ let snap=await window.fs.getDocs(window.fs.query(window.fs.collection(window.db,"penjualan"), window.fs.orderBy("createdAt","desc"))); let jual=snap.docs.map(d=>({id:d.id,...d.data()})); let tot=jual.reduce((t,r)=>t+r.total,0); document.getElementById('ringkasan').innerHTML="Transaksi: "+jual.length+" | Omset: Rp"+tot.toLocaleString('id-ID')+" | Menu: "+menu.length; document.getElementById('tabelLaporan').innerHTML="<tr><th>Tgl</th><th>Cabang</th><th>Total</th><th>Item</th></tr>"+jual.slice(0,200).map(r=>"<tr><td>"+new Date(r.tanggal).toLocaleString('id-ID')+"</td><td>"+r.cabang+"</td><td>Rp"+r.total.toLocaleString('id-ID')+"</td><td style='font-size:9px'>"+(r.items||[]).map(i=>i.nama+" x"+i.qty).join(", ")+"</td></tr>").join(""); }catch(e){ document.getElementById('ringkasan').innerText=e.message; } }
function logout(){ if(confirm("Keluar?")){ localStorage.removeItem('kbh_role'); location.reload(); } }
let sr=localStorage.getItem('kbh_role'); if(sr){ role=sr; cabang=localStorage.getItem('kbh_cabang')||"Cabang"; kasir=localStorage.getItem('kbh_kasir')||"Kasir"; document.getElementById('login').classList.remove('active'); init(); }
