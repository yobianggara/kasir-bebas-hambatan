function showTab(id){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='laporan') loadLaporan(); if(id==='menuAdmin') renderMenuAdmin(); if(id==='kasir'){ renderKasir(); renderHold(); } }
function doLogin(){
  let r=document.getElementById('role').value; let p=document.getElementById('pin').value; let nk=document.getElementById('namaKasir').value||"Kasir"; let nc=document.getElementById('namaCabang').value||"Karangpandan";
  if(r==='admin' && p!=='112234'){ document.getElementById('loginStatus').textContent='Kode salah! 112234'; return; }
  role=r; cabang=nc; kasir=nk; localStorage.setItem('kbh_role',r); localStorage.setItem('kbh_cabang',nc); localStorage.setItem('kbh_kasir',nk);
  document.getElementById('login').classList.remove('active'); document.getElementById('infoC').textContent=nc; document.getElementById('cabangLabel').textContent=nc+' - '+nk;
  document.getElementById('filterCabangMenu').value=''; // RESET FILTER JADI AUTO - BIAR GA KOSONG!
  init();
}
function logout(){ if(confirm('Keluar?')){ localStorage.removeItem('kbh_role'); location.reload(); } }

async function init(){
  document.getElementById('syncDot').className='sync-dot sync-on'; document.getElementById('syncText').textContent='Online - Connected';
  db.collection('menu_dapur_moro').onSnapshot(snap=>{
    menu=snap.docs.map(d=>({id:d.id, _docId:d.id, ...d.data()}));
    if(menu.length===0){ menu=DEFAULT_MENU.map((m,i)=>({id:'m'+i, _docId:'m'+i, ...m})); }
    document.getElementById('totalInfo').textContent=menu.length+' menu';
    renderKasir();
  }, err=>{
    document.getElementById('syncDot').className='sync-dot sync-off'; document.getElementById('syncText').textContent='Offline - '+err.message;
    menu=DEFAULT_MENU.map((m,i)=>({id:'m'+i, _docId:'m'+i, ...m}));
    renderKasir();
  });
  showTab('kasir');
}

function getBaseMenu(){
  let fc=document.getElementById('filterCabangMenu')?.value||'';
  let base;
  if(fc===''){ // AUTO: cabang saya + Semua Cabang
    base=menu.filter(m=>{ let c=(m.cabang||'').toLowerCase().trim(); return c===cabang.toLowerCase() || c==='semua cabang'; });
  } else if(fc==='ALL'){ // SEMUA
    base=[...menu];
  } else {
    base=menu.filter(m=> (m.cabang||'').toLowerCase().trim()===fc.toLowerCase());
  }
  return base;
}

function renderCat(){
  let base=getBaseMenu();
  let cats=["Semua",...new Set(base.map(m=>m.kategori))];
  document.getElementById('catFilter').innerHTML=cats.map(c=>`<span class="cat-chip ${catActive===c?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</span>`).join('');
  // DEBUG
  let counts={ Karang: menu.filter(m=>(m.cabang||'').toLowerCase()==='karang').length, Karangpandan: menu.filter(m=>(m.cabang||'').toLowerCase()==='karangpandan').length, Semua: menu.filter(m=>(m.cabang||'').toLowerCase()==='semua cabang').length };
  document.getElementById('debugInfo').innerHTML=`Cabang Login: <b>${cabang}</b> | Filter: <b>${document.getElementById('filterCabangMenu').value||'AUTO ('+cabang+' + Paten)'}</b> | Base: ${base.length} menu | Total DB: ${menu.length} | Karang:${counts.Karang} Pandan:${counts.Karangpandan} Paten:${counts.Semua} | Kategori Aktif: ${catActive}`;
  document.getElementById('filterInfo').textContent=`Filter: ${document.getElementById('filterCabangMenu').value||cabang} - ${base.length} menu`;
}

function setCat(c){ catActive=c; renderKasir(); }

function renderKasir(){
  let q=(document.getElementById('cariMenu').value||'').toLowerCase();
  let base=getBaseMenu();
  let filtered=base.filter(m=>(catActive==='Semua'||m.kategori===catActive) && m.nama.toLowerCase().includes(q));
  renderCat();
  if(filtered.length===0){
    let fc=document.getElementById('filterCabangMenu').value;
    document.getElementById('menuGrid').innerHTML=`<div style="color:white;padding:20px;text-align:center;grid-column:1/-1">
      Menu ${cabang} kosong? Filter: ${fc||'AUTO '+cabang+' + Paten'}<br>
      Base: ${base.length} menu | Total: ${menu.length} menu | Kategori: ${catActive}<br>
      <div style="margin-top:10px;display:flex;gap:6px;justify-content:center">
        <button onclick="document.getElementById('filterCabangMenu').value='';catActive='Semua';document.getElementById('cariMenu').value='';renderKasir()" style="background:white;color:#B71C1C;border:none;padding:8px 12px;border-radius:6px;font-weight:bold">🔄 Reset Filter - Lihat Semua</button>
        <button onclick="document.getElementById('filterCabangMenu').value='ALL';catActive='Semua';renderKasir()" style="background:#FF9800;color:white;border:none;padding:8px 12px;border-radius:6px;font-weight:bold">🌏 Lihat 218 Menu Semua Cabang</button>
      </div>
      <br><button onclick="seed218()" style="margin-top:8px;background:#1565C0;color:white;border:none;padding:6px 12px;border-radius:6px">🌱 SEED 218 MENU</button>
    </div>`;
    return;
  }
  document.getElementById('menuGrid').innerHTML=filtered.map((m)=>{
    let globalIdx=menu.indexOf(m);
    return `<div class="menu-card" onclick="tambahKeKeranjangByIdx(${globalIdx})"><b style="font-size:12px">${m.nama}</b><div style="font-size:10px;color:#666">${m.kategori} - <small>${m.cabang}</small></div><div class="price">Rp${m.harga.toLocaleString()}</div></div>`;
  }).join('');
}

function tambahKeKeranjangByIdx(globalIdx){
  let m=menu[globalIdx]; if(!m) return;
  let ex=keranjang.find(k=>k._idx===globalIdx);
  if(ex) ex.qty++; else keranjang.push({ _idx:globalIdx, id:m.id, nama:m.nama, harga:m.harga, qty:1 });
  renderKeranjang();
}
function renderKeranjang(){ if(keranjang.length===0){document.getElementById('listKeranjang').innerHTML='<i>Kosong - Klik menu, sekarang pasti bisa!</i>';} else {document.getElementById('listKeranjang').innerHTML=keranjang.map((k,i)=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #eee"><div><b style="font-size:11px">${k.nama}</b><br><small>Rp${k.harga.toLocaleString()} x ${k.qty}</small></div><div><button onclick="ubahQty(${i},-1)">-</button> <b>${k.qty}</b> <button onclick="ubahQty(${i},1)">+</button> <button onclick="hapusItem(${i})" style="background:#c0392b;color:white;border:none;padding:2px 6px;border-radius:4px">x</button></div></div>`).join('');} let sub=keranjang.reduce((t,k)=>t+k.harga*k.qty,0); document.getElementById('sub').textContent=sub.toLocaleString(); document.getElementById('total').textContent=sub.toLocaleString(); }
function ubahQty(i,d){ keranjang[i].qty+=d; if(keranjang[i].qty<=0) keranjang.splice(i,1); renderKeranjang(); }
function hapusItem(i){ keranjang.splice(i,1); renderKeranjang(); }
function hitungKembali(){ let bayar=parseInt(document.getElementById('bayar').value)||0; let total=keranjang.reduce((t,k)=>t+k.harga*k.qty,0); document.getElementById('kembali').textContent=(bayar-total).toLocaleString(); }
function holdPesanan(){ if(keranjang.length===0) return alert('Kosong!'); let pel=document.getElementById('pelanggan').value||'Meja'; holdList.push({items:[...keranjang], pelanggan:pel, cabang:cabang, waktu:new Date().toLocaleString(), total:keranjang.reduce((t,k)=>t+k.harga*k.qty,0)}); localStorage.setItem('kbh_hold', JSON.stringify(holdList)); keranjang=[]; document.getElementById('pelanggan').value=''; renderKeranjang(); renderHold(); }
function renderHold(){ holdList=JSON.parse(localStorage.getItem('kbh_hold')||"[]"); document.getElementById('holdCount').textContent=holdList.length+' hold'; document.getElementById('holdContainer').style.display=holdList.length>0?'block':'none'; document.getElementById('holdList').innerHTML=holdList.map((h,i)=>`<div class="hold-item"><div><b style="font-size:11px">${h.pelanggan}</b> - Rp${h.total.toLocaleString()}<br><small style="font-size:9px">${h.waktu} - ${h.items.length} item</small></div><div><button onclick="loadHold(${i})" style="background:#1565C0;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:10px">Load</button> <button onclick="hapusHold(${i})" style="background:#c0392b;color:white;border:none;padding:4px 6px;border-radius:4px;font-size:10px">x</button></div></div>`).join(''); }
function loadHold(i){ keranjang=holdList[i].items; holdList.splice(i,1); localStorage.setItem('kbh_hold', JSON.stringify(holdList)); renderKeranjang(); renderHold(); }
function hapusHold(i){ holdList.splice(i,1); localStorage.setItem('kbh_hold', JSON.stringify(holdList)); renderHold(); }

function buatStruk(data){ let tgl=new Date().toLocaleString('id-ID'); let s=`DAPUR MORO KUTO\n${data.cabang}\nKasir: ${data.kasir}\n================================\n${tgl}\n--------------------------------\n`; data.items.forEach(k=>{ s+=`${k.nama} x${k.qty}  Rp${(k.harga*k.qty).toLocaleString()}\n`; }); s+=`--------------------------------\nTOTAL: Rp${data.total.toLocaleString()}\nBayar: Rp${data.bayar.toLocaleString()}\nKembali: Rp${data.kembalian.toLocaleString()}\n================================\nTERIMA KASIH\n`; lastStruk=s; return s; }
function printRawBT(){ if(!lastStruk) return alert('Bayar dulu!'); document.getElementById('printStatus').style.display='block'; document.getElementById('printStatus').innerHTML='📱 Buka RawBT...'; window.location.href='rawbt://print?text='+encodeURIComponent(lastStruk); }
async function printBT(){ if(!lastStruk) return alert('Bayar dulu!'); try{ const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xFFE0,'000018f0-0000-1000-8000-00805f9b34fb']}); const server=await device.gatt.connect(); let service,char; try{service=await server.getPrimaryService(0xFFE0);char=await service.getCharacteristic(0xFFE1);}catch(e){service=await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');char=await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');} await char.writeValue(new TextEncoder().encode(lastStruk+"\n\n\n")); document.getElementById('printStatus').style.display='block'; document.getElementById('printStatus').innerHTML='✅ Print BT RPP02N sukses!'; }catch(err){ document.getElementById('printStatus').style.display='block'; document.getElementById('printStatus').innerHTML='❌ '+err.message; setTimeout(printRawBT,800); } }
function printKertas(){ if(!lastStruk) return alert('Bayar dulu!'); let w=window.open('','','width=300,height=600'); w.document.write(`<html><body><pre style="font-family:monospace;font-size:12px;white-space:pre-wrap">${lastStruk}</pre><script>setTimeout(()=>window.print(),500);<\/script></body></html>`); w.document.close(); }
async function bayar(){ if(keranjang.length==0) return alert('Kosong!'); let bayarVal=parseInt(document.getElementById('bayar').value)||0; let total=keranjang.reduce((t,k)=>t+k.harga*k.qty,0); if(bayarVal<total) return alert('Uang kurang!'); let data={tanggal:new Date().toISOString(),cabang:cabang,kasir:kasir,items:[...keranjang],total:total,bayar:bayarVal,kembalian:bayarVal-total,createdAt:firebase.firestore.FieldValue.serverTimestamp()}; buatStruk(data); try{ await db.collection('penjualan_dapur_moro').add(data); alert('✅ SUKSES! '+cabang+' Rp'+total.toLocaleString()+' - BT Working!'); }catch(e){ alert('Gagal sync: '+e.message); } keranjang=[]; document.getElementById('bayar').value=''; renderKeranjang(); }
async function tambahMenu(){ if(role!=='admin') return alert('Hanya admin!'); let nama=document.getElementById('mNama').value.trim(); let harga=parseInt(document.getElementById('mHarga').value)||0; let kategori=document.getElementById('mKategori').value; let cab=document.getElementById('mCabang').value; if(!nama||!harga) return alert('Isi!'); try{ let id=(nama+'_'+cab).replace(/[\/#?\s]+/g,'_')+'_'+Date.now(); await db.collection('menu_dapur_moro').doc(id).set({nama:nama,harga:harga,kategori:kategori,cabang:cab,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); alert('✅ Menu '+nama+' cabang '+cab+' ditambah!'); document.getElementById('mNama').value=''; document.getElementById('mHarga').value=''; }catch(e){ alert('Gagal: '+e.message); } }
async function seed218(){ if(role!=='admin') return alert('Hanya admin!'); if(!confirm('Seed 218 menu?')) return; try{ let count=0; for(let m of DEFAULT_MENU){ let id=(m.nama+'_'+m.cabang).replace(/[\/#?\s]+/g,'_'); await db.collection('menu_dapur_moro').doc(id).set({nama:m.nama,harga:m.harga,kategori:m.kategori,cabang:m.cabang,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); count++; } alert('✅ '+count+' menu seeded!'); }catch(e){ alert('Gagal: '+e.message); } }
function renderMenuAdmin(){ if(role!=='admin'){ document.getElementById('tabelMenu').innerHTML='<tr><td>Hanya admin!</td></tr>'; return; } let q=(document.getElementById('cariMenuAdmin')?.value||'').toLowerCase(); let filtered=menu.filter(m=>m.nama.toLowerCase().includes(q)); document.getElementById('totalMenu').textContent=filtered.length; document.getElementById('tabelMenu').innerHTML='<tr><th>Nama</th><th>Cabang</th><th>Aksi</th></tr>'+filtered.slice(0,100).map(m=>`<tr><td><b style="font-size:11px">${m.nama}</b> Rp${m.harga.toLocaleString()}</td><td style="font-size:9px">${m.cabang}</td><td><button onclick="hapusMenuByIdx(${menu.indexOf(m)})" style="background:#c0392b;color:white;border:none;padding:4px 8px;border-radius:4px;font-size:9px">Hapus</button></td></tr>`).join(''); }
async function hapusMenuByIdx(idx){ let m=menu[idx]; if(!m) return; if(!confirm('Hapus '+m.nama+'?')) return; try{ await db.collection('menu_dapur_moro').doc(m._docId).delete(); }catch(e){ alert('Gagal: '+e.message); } }
async function loadLaporan(){ document.getElementById('ringkasan').innerHTML='Loading...'; try{ let snap=await db.collection('penjualan_dapur_moro').orderBy('createdAt','desc').limit(200).get(); let jual=snap.docs.map(d=>({id:d.id,...d.data()})); let total=jual.reduce((t,r)=>t+(r.total||0),0); document.getElementById('ringkasan').innerHTML=`<b>ONLINE</b> - Total: Rp${total.toLocaleString()} | ${jual.length} trx`; document.getElementById('tabelLaporan').innerHTML='<tr><th>Tgl</th><th>Cabang</th><th>Total</th></tr>'+jual.map(r=>`<tr><td>${new Date(r.tanggal).toLocaleString()}</td><td>${r.cabang}</td><td>Rp${(r.total||0).toLocaleString()}</td></tr>`).join(''); }catch(e){ document.getElementById('ringkasan').innerHTML='❌ '+e.message; } }

let sr=localStorage.getItem('kbh_role'); if(sr){ role=sr; cabang=localStorage.getItem('kbh_cabang')||"Karangpandan"; kasir=localStorage.getItem('kbh_kasir')||"Kasir"; document.getElementById('login').classList.remove('active'); document.getElementById('infoC').textContent=cabang; document.getElementById('cabangLabel').textContent=cabang+" - "+kasir; document.getElementById('filterCabangMenu').value=''; init(); }
</script>
</body></html>
