<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kasir Bebas Hambatan - FIX LOGIN</title><style>*{box-sizing:border-box;font-family:'Segoe UI',Arial;margin:0;padding:0}body{background:#e8f5e9}.header{position:sticky;top:0;background:#2E7D32;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:20}.nav button{padding:7px 11px;background:#43A047;border:none;color:white;border-radius:6px;margin-left:4px;cursor:pointer;font-size:12px}.menu{padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:360px}.card{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1)}.btn-tambah{width:100%;padding:8px;background:#2E7D32;color:white;border:none;border-radius:7px;margin-top:6px;font-weight:bold}.keranjang{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;box-shadow:0 -3px 12px rgba(0,0,0,.18);max-height:50vh;overflow-y:auto;border-top-left-radius:16px;border-top-right-radius:16px;z-index:15}.btn{width:100%;padding:12px;border:none;border-radius:9px;font-size:14px;font-weight:bold;color:white;margin-top:6px;cursor:pointer}.btn-bayar{background:#43A047}.btn-print{background:#1565C0}.btn-laporan{background:#2E7D32}input,select{width:100%;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:6px}.total-box{font-weight:bold;font-size:19px;color:#2E7D32;margin:6px 0}.tab{display:none}.tab.active{display:block}.tabel-riwayat{width:100%;font-size:11px;border-collapse:collapse}.tabel-riwayat td,.tabel-riwayat th{border:1px solid #ddd;padding:6px;text-align:left}.badge{display:inline-block;padding:3px 8px;border-radius:12px;background:#fff;color:#2E7D32;font-size:10px}.login-wrap{padding:20px;max-width:420px;margin:30px auto;background:white;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}</style></head><body>
<div class="header"><span>💰 BEBAS HAMBATAN <small id="infoCabang" class="badge"></small> <small style="font-size:9px;background:yellow;color:black;padding:2px 6px;border-radius:4px">FIX LOGIN V2</small></span><div class="nav"><button onclick="showTab('kasir')">Kasir</button><button onclick="showTab('laporan')">Laporan</button><button onclick="logout()" style="background:#c0392b">Logout</button></div></div>
<div id="login" class="tab active"><div class="login-wrap"><h3 style="color:#2E7D32;text-align:center">Kasir Bebas Hambatan<br><small>FIX LOGIN - Klik Sekali Langsung Masuk</small></h3><label>Role</label><select id="loginRole" onchange="toggleCabangInput()"><option value="cabang">Kasir Cabang</option><option value="admin">Admin Pusat</option></select><div id="cabangInputWrap"><label>Nama Cabang</label><select id="loginCabang"><option value="Cabang Karangpandan">Cabang Karangpandan</option><option value="Cabang Solo">Cabang Solo</option><option value="Cabang Karanganyar">Cabang Karanganyar</option><option value="Cabang Tawangmangu">Cabang Tawangmangu</option></select></div><button class="btn btn-bayar" onclick="doLogin()" style="margin-top:12px;font-size:16px">MASUK (FIX)</button><p id="status" style="font-size:11px;margin-top:8px;color:#666">Jika tidak masuk, cek apakah JavaScript di browser aktif.</p></div></div>
<div id="kasir" class="tab"><div style="padding:10px;display:flex;gap:6px"><input type="text" id="noMeja" placeholder="Nama Pelanggan / No Meja" style="flex:1"><button onclick="editMenu()" style="padding:8px;background:#2E7D32;color:white;border:none;border-radius:6px;font-size:11px">⚙️ Menu</button></div><div class="menu" id="menu"></div><div class="keranjang"><div style="display:flex;justify-content:space-between"><h4>Keranjang</h4><span id="cabangLabel" style="font-size:11px;color:#2E7D32"></span></div><div id="listKeranjang"><i>Kosong</i></div><div>Subtotal: Rp<span id="subtotal">0</span></div><div class="total-box">TOTAL: Rp<span id="total">0</span></div><input type="number" id="bayar" placeholder="Uang Pembeli" oninput="hitungKembalian()"><div style="font-weight:bold">Kembalian: Rp<span id="kembalian">0</span> <small id="statusBayar"></small></div><button class="btn btn-bayar" id="btnBayarAction" onclick="bayar()">BAYAR & SIMPAN</button><button class="btn btn-print" onclick="printBluetooth()">🖨️ PRINT</button></div></div>
<div id="laporan" class="tab" style="padding:10px"><h3>Laporan - <span id="laporanCabangInfo"></span></h3><div id="ringkasan" style="background:white;padding:12px;border-radius:8px;margin:10px 0"></div><div style="overflow-x:auto;background:white;border-radius:8px"><table class="tabel-riwayat" id="tabelRiwayat"></table></div></div>
<script>
let menu=JSON.parse(localStorage.getItem("kbh_menu")||"null")||[{nama:"Espresso",harga:6000,kategori:"Minuman"},{nama:"Americano",harga:6000,kategori:"Minuman"},{nama:"Mie Ayam",harga:10000,kategori:"Makanan"},{nama:"Es Teh",harga:3000,kategori:"Minuman"},{nama:"Gorengan Mix",harga:8000,kategori:"Snack"}];
let keranjang=[]; let lastStruk=""; let currentCabang=localStorage.getItem("kbh_cabang")||""; let currentRole=localStorage.getItem("kbh_role")||""; let riwayat=JSON.parse(localStorage.getItem("kbh_riwayat")||"[]");
function toggleCabangInput(){document.getElementById("cabangInputWrap").style.display=document.getElementById("loginRole").value==="admin"?"none":"block";}
function doLogin(){ console.log("doLogin clicked"); try{ let role=document.getElementById("loginRole").value; let sel=document.getElementById("loginCabang").value; let cabang=role==="admin"?"ADMIN PUSAT":sel; if(role!=="admin"&&!cabang){alert("Isi cabang!");return;} localStorage.setItem("kbh_role",role); localStorage.setItem("kbh_cabang",cabang); currentRole=role; currentCabang=cabang; document.getElementById("login").classList.remove("active"); initApp(); document.getElementById("status").innerText="Berhasil login sebagai "+cabang; }catch(e){ alert("Error login: "+e.message); console.error(e);} }
function logout(){ if(confirm("Logout?")){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById("login").classList.add("active"); } }
function editMenu(){ let n=prompt("Nama produk baru:"); if(!n)return; let h=parseInt(prompt("Harga:","10000")); if(isNaN(h))return; menu.push({nama:n,harga:h,kategori:"Lainnya"}); localStorage.setItem("kbh_menu",JSON.stringify(menu)); loadMenu(); }
function initApp(){ document.getElementById("infoCabang").innerText=currentCabang+" ("+currentRole+")"; document.getElementById("cabangLabel").innerText=currentCabang; document.getElementById("laporanCabangInfo").innerText=currentCabang; showTab('kasir'); loadMenu(); tampilKeranjang(); loadLaporan(); }
function showTab(id){ if(!currentRole&&id!=='login'){document.getElementById("login").classList.add("active");return;} document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id=='laporan') loadLaporan(); }
function loadMenu(){ let kat=[...new Set(menu.map(m=>m.kategori))]; document.getElementById("menu").innerHTML=kat.map(k=>{ let items=menu.map((m,i)=>({...m,idx:i})).filter(m=>m.kategori===k); return `<div style="grid-column:1/-1;font-weight:bold;color:#2E7D32;margin-top:6px">${k}</div>`+items.map(m=>`<div class="card"><b>${m.nama}</b><br><small>Rp${m.harga.toLocaleString('id-ID')}</small><button class="btn-tambah" onclick="tambah(${m.idx})">+ Tambah</button></div>`).join(""); }).join(""); }
function tambah(i){ let it=keranjang.find(k=>k.nama==menu[i].nama); if(it)it.qty++; else keranjang.push({...menu[i],qty:1}); tampilKeranjang(); }
function tampilKeranjang(){ document.getElementById("listKeranjang").innerHTML=keranjang.length==0?"<i>Kosong</i>":keranjang.map((k,i)=>`<div style="display:flex;justify-content:space-between"><span>${k.nama} x${k.qty}</span><span><b>Rp${(k.harga*k.qty).toLocaleString('id-ID')}</b> <button onclick="hapus(${i})" style="background:#c0392b;color:white;border:none;border-radius:4px;padding:2px 6px">x</button></span></div>`).join(""); hitungTotal(); }
function hitungTotal(){ let sub=keranjang.reduce((t,k)=>t+k.harga*k.qty,0); document.getElementById("subtotal").innerText=sub.toLocaleString('id-ID'); document.getElementById("total").innerText=sub.toLocaleString('id-ID'); window._total=sub; hitungKembalian(); }
function hitungKembalian(){ let total=window._total||0; let bayar=parseInt(document.getElementById("bayar").value)||0; let kembali=bayar-total; let el=document.getElementById("kembalian"); el.innerText=kembali.toLocaleString('id-ID'); let st=document.getElementById("statusBayar"); let btn=document.getElementById("btnBayarAction"); if(bayar===0){st.innerText="";btn.disabled=false;} else if(kembali<0){st.innerText=` (Kurang Rp${Math.abs(kembali).toLocaleString('id-ID')})`;btn.disabled=true;} else{st.innerText=kembali===0?" (Uang Pas)":" (Siap)";btn.disabled=false;} }
function hapus(i){keranjang.splice(i,1);tampilKeranjang();}
function buatStruk(data){ let tgl=new Date().toLocaleString('id-ID'); let s=`KASIR BEBAS HAMBATAN\n${data.cabang}\n================================\nPelanggan:${data.meja}\n${tgl}\n--------------------------------\n`; keranjang.forEach(k=>{s+=`${k.nama} x${k.qty}\n  Rp${(k.harga*k.qty).toLocaleString('id-ID')}\n`;}); s+=`--------------------------------\nTOTAL: Rp${data.total.toLocaleString('id-ID')}\nBayar: Rp${data.bayar.toLocaleString('id-ID')}\nKembali: Rp${data.kembalian.toLocaleString('id-ID')}\n================================\nTERIMA KASIH\n`; lastStruk=s; return s; }
function bayar(){ if(keranjang.length==0)return alert("Kosong!"); hitungTotal(); hitungKembalian(); let total=window._total; let bayarVal=parseInt(document.getElementById("bayar").value)||0; if(bayarVal<total)return alert("Uang kurang!"); let dataTrx={id:Date.now(),tanggal:new Date().toISOString(),cabang:currentCabang,meja:document.getElementById("noMeja").value||"Umum",total:total,bayar:bayarVal,kembalian:bayarVal-total,items:[...keranjang]}; buatStruk(dataTrx); riwayat.push(dataTrx); localStorage.setItem("kbh_riwayat",JSON.stringify(riwayat)); alert(`SUKSES! Kembali Rp${dataTrx.kembalian.toLocaleString('id-ID')}`); keranjang=[]; document.getElementById("bayar").value=""; document.getElementById("noMeja").value=""; tampilKeranjang(); loadLaporan(); 
 // Coba sync ke Firebase kalau ada - tidak wajib, jadi kalau gagal tetap simpan lokal
 try{ if(window._db){ import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(async (m)=>{ await m.addDoc(m.collection(window._db,"penjualan"),dataTrx); console.log("Sync Firebase OK"); }); } }catch(e){ console.log("Skip Firebase sync:",e); } }
async function printBluetooth(){ if(!lastStruk)return alert("Bayar dulu!"); try{ const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xFFE0,'000018f0-0000-1000-8000-00805f9b34fb']}); const server=await device.gatt.connect(); let service,char; try{service=await server.getPrimaryService(0xFFE0);char=await service.getCharacteristic(0xFFE1);}catch(e){service=await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');char=await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');} await char.writeValue(new TextEncoder().encode(lastStruk+"\n\n\n")); alert("Print ok!"); }catch(err){alert("Gagal: "+err.message);} }
function loadLaporan(){ let dataFilter=riwayat.filter(r=>{ return (currentRole==="admin")?true:r.cabang===currentCabang; }); let total=dataFilter.reduce((t,r)=>t+r.total,0); let trx=dataFilter.length; document.getElementById("ringkasan").innerHTML=`<b>Transaksi:</b> ${trx}<br><b>Total:</b> Rp${total.toLocaleString('id-ID')}`; document.getElementById("tabelRiwayat").innerHTML=`<tr><th>Tgl</th><th>Cabang</th><th>Meja</th><th>Total</th></tr>`+dataFilter.slice(0,100).map(r=>`<tr><td>${new Date(r.tanggal).toLocaleString('id-ID')}</td><td>${r.cabang}</td><td>${r.meja}</td><td>Rp${r.total.toLocaleString('id-ID')}</td></tr>`).join(""); }
if(currentRole&&currentCabang){document.getElementById("login").classList.remove("active");initApp();}
</script>
<script type="module">
try{
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyByZ6nSKWhx2B8RfjAvTsyuAuv1XMcVq4I", authDomain: "kasir-bebas-hambatan.firebaseapp.com", projectId: "kasir-bebas-hambatan", storageBucket: "kasir-bebas-hambatan.firebasestorage.app", messagingSenderId: "283163883169", appId: "1:283163883169:web:6d68605a811ecdceb762e0" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); window._db=db; console.log("Firebase OK");
}catch(e){ console.log("Firebase skip (file:// diblokir), tapi login tetap jalan:", e.message); }
</script>
</body></html>
